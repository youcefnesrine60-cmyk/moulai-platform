[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    dining_postgres: PostgreSQL dining cases requiring their isolated local profile
    k10_postgres: PostgreSQL tenant cases requiring their isolated E1 profile
    country_rehearsal: PostgreSQL O3/O4 tests executed only by their disposable-schema launcher
    operational_rehearsal: PostgreSQL O2 tests executed only by their disposable-schema launcher
addopts = -v --cov=app --cov-report=term-missing
